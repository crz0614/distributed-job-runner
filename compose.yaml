services:
  runner:
    build: .
    environment:
      DATABASE_URL: postgres://runner:runner@postgres:5432/runner?sslmode=disable
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env before starting the stack}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: runner
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
    volumes:
      - runner-postgres:/var/lib/postgresql/data
      - ./internal/runner/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runner -d runner"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  runner-postgres:
