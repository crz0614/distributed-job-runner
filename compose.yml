services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: runner
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
    ports:
      - "5432:5432"
    volumes:
      - runner-postgres:/var/lib/postgresql/data
      - ./deploy/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runner -d runner"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  runner-postgres:
